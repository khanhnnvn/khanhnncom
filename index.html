<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Trang cá nhân của Mr Khanhnn">
    <title>Mr Khanhnn</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
            position: relative;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.07;
            pointer-events: none;
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg, transparent, transparent 2px,
                rgba(0, 255, 65, 0.012) 2px, rgba(0, 255, 65, 0.012) 4px
            );
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .message {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.4rem, 4vw, 2.8rem);
            font-weight: 700;
            color: #00ff41;
            text-shadow:
                0 0 10px rgba(0, 255, 65, 0.4),
                0 0 40px rgba(0, 255, 65, 0.15),
                0 0 80px rgba(0, 255, 65, 0.05);
            letter-spacing: 3px;
            animation: fadeGlow 3s ease-in-out infinite alternate;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 1em;
            background: #00ff41;
            margin-left: 4px;
            vertical-align: text-bottom;
            animation: blink 0.8s infinite;
            box-shadow: 0 0 8px rgba(0, 255, 65, 0.5);
        }

        @keyframes fadeGlow {
            0% { text-shadow: 0 0 10px rgba(0,255,65,0.4), 0 0 40px rgba(0,255,65,0.15); }
            100% { text-shadow: 0 0 20px rgba(0,255,65,0.6), 0 0 60px rgba(0,255,65,0.25), 0 0 100px rgba(0,255,65,0.1); }
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div class="scanline"></div>
    <div class="container">
        <h1 class="message" id="typed"></h1>
    </div>
    <script>
        (function () {
            'use strict';

            // Matrix rain
            var canvas = document.getElementById('matrix');
            var ctx = canvas.getContext('2d');
            function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
            resize();
            addEventListener('resize', resize);
            var chars = 'アイウエオカキクケコ0123456789ABCDEF<>{}[]';
            var arr = chars.split('');
            var sz = 14, cols = Math.floor(canvas.width / sz);
            var drops = [];
            for (var i = 0; i < cols; i++) drops[i] = Math.random() * -100;
            setInterval(function () {
                ctx.fillStyle = 'rgba(10,10,15,0.06)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#00ff41';
                ctx.font = sz + 'px JetBrains Mono,monospace';
                for (var i = 0; i < drops.length; i++) {
                    ctx.fillText(arr[Math.floor(Math.random() * arr.length)], i * sz, drops[i] * sz);
                    if (drops[i] * sz > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }, 50);

            // Typing effect — uses safe DOM APIs only
            var el = document.getElementById('typed');
            var text = 'Chào bạn, tôi là Khánh đây ^^';
            var idx = 0;
            var textNode = document.createTextNode('');
            var cursor = document.createElement('span');
            cursor.className = 'cursor';
            el.appendChild(textNode);
            el.appendChild(cursor);
            function type() {
                if (idx <= text.length) {
                    textNode.textContent = text.substring(0, idx);
                    idx++;
                    setTimeout(type, 90);
                }
            }
            setTimeout(type, 800);
        })();
    </script>
</body>
</html>
